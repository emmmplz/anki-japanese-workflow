<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地语音生成</title>
<style>
body{font:16px/1.7 system-ui,"Microsoft YaHei",sans-serif;background:#f8f4eb;color:#343630;margin:0;padding:28px}
main{max-width:760px;margin:30px auto;background:#fffdf8;border:1px solid #ddd8cb;border-radius:20px;padding:28px}
h1{font-size:28px;margin:0}p{color:#65705d}label{display:block;margin:18px 0 6px}textarea,select,button{font:inherit}
textarea{box-sizing:border-box;width:100%;height:150px;padding:14px;border:1px solid #c8cabb;border-radius:10px;resize:vertical}
select{max-width:100%;padding:8px;border:1px solid #c8cabb;border-radius:8px}button{margin-top:22px;padding:10px 24px;border:0;border-radius:10px;background:#386251;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:wait}
audio{width:100%;margin-top:20px}#result{margin-top:16px;white-space:pre-wrap}a{color:#386251}.row{display:flex;gap:25px;flex-wrap:wrap}
</style><main><h1>本地语音生成</h1><p id="status">正在连接服务…</p>
<form id="form"><label for="text">朗读文本</label><textarea id="text" required>天気予報によると、明日雨が降るそうです。</textarea>
<div class="row"><div><label for="voice">音色</label><select id="voice"></select></div><div><label for="language">语言</label><select id="language"></select></div>
<div><label for="speed">语速</label><select id="speed"><option value="0.8">0.8 倍</option><option selected value="1">正常</option><option value="1.2">1.2 倍</option></select></div></div>
<button id="generate" disabled>生成语音</button></form><div id="result" role="status"></div><audio id="audio" controls hidden></audio>
<p><a id="download" hidden download="speech.wav">下载音频</a></p><p><a href="/docs">调用说明</a></p></main>
<script src="/web.js" defer></script></html>
